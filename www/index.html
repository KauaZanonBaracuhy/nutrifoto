<!DOCTYPE html>
<html lang="pt-BR" data-theme="azul">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0C0F14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NutriFoto" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <title>NutriFoto</title>
  <script src="/vendor/lucide.js"></script>
  <script src="/vendor/chart.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="erro-inicial" role="alert"></div><div class="app">

    <!-- ============ DASHBOARD ============ -->
    <section id="screen-dashboard" class="screen active">
      <header class="header">
        <div class="header-row">
          <h1>NutriFoto</h1>
          <button class="icon-btn" id="btn-toggle-theme" aria-label="Próximo tema">
            <i data-lucide="palette"></i>
          </button>
        </div>
      </header>

      <main class="main" id="dashboard-main">
        <div class="hero-donut" id="hero-donut">
          <canvas id="donut-hero" width="180" height="180"></canvas>
          <div class="hero-donut-center">
            <div class="hero-value" id="hero-cal-value">0</div>
            <div class="hero-label">/ <span id="hero-cal-goal">2200</span> kcal</div>
            <div class="streak-badge" id="streak-badge">
              <i data-lucide="flame" class="streak-icon"></i>
              <span class="streak-num" id="streak-num">0</span>
              <span class="streak-label">dias</span>
            </div>
          </div>
        </div>

        <div class="macro-bars" id="macro-bars"></div>

        <div class="mini-chart-section" id="mini-chart-section">
          <div class="mini-chart-bar" id="mini-chart-bar"></div>
          <button class="mini-chart-expand" id="btn-expand-charts">
            <span>Gráficos da semana</span>
            <i data-lucide="chevron-down" class="expand-icon"></i>
          </button>
        </div>

        <div class="charts-expanded" id="charts-expanded" style="display:none">
          <div class="chart-card">
            <h3 class="chart-title">Calorias — últimos 7 dias</h3>
            <div class="chart-wrap"><canvas id="chart-bars"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 class="chart-title">Proteína — últimos 7 dias</h3>
            <div class="chart-wrap"><canvas id="chart-line"></canvas></div>
          </div>
          <div class="chart-card">
            <div class="chart-title-row">
              <h3 class="chart-title">Peso corporal</h3>
              <div class="weight-chart-filters" id="weight-chart-filters">
                <button class="weight-filter-btn active" data-days="7">7d</button>
                <button class="weight-filter-btn" data-days="30">30d</button>
                <button class="weight-filter-btn" data-days="90">90d</button>
                <button class="weight-filter-btn" data-days="0">Tudo</button>
              </div>
            </div>
            <div class="chart-wrap"><canvas id="chart-weight"></canvas></div>
          </div>
        </div>

        <div class="weight-card" id="weight-card">
          <div class="weight-card-display" id="weight-card-display">
            <div class="weight-card-info">
              <span class="weight-card-label">Peso</span>
              <span class="weight-card-value" id="weight-current">—</span>
              <span class="weight-card-delta" id="weight-delta"></span>
            </div>
            <button class="weight-card-btn" id="btn-register-weight" aria-label="Registrar peso">
              <i data-lucide="plus" style="width:18px;height:18px"></i>
            </button>
          </div>
          <div class="weight-card-input" id="weight-card-input" style="display:none">
            <input type="number" id="weight-input" min="20" max="400" step="0.1" inputmode="decimal" placeholder="ex: 78.5" class="weight-input-field" />
            <button class="weight-input-confirm" id="weight-confirm">
              <i data-lucide="check" style="width:16px;height:16px"></i> Salvar
            </button>
            <button class="weight-input-cancel" id="weight-cancel">
              <i data-lucide="x" style="width:14px;height:14px"></i>
            </button>
          </div>
        </div>

        <div class="water-card" id="water-card">
          <div class="water-card-header">
            <div class="water-card-label-row">
              <span class="water-card-label">Água</span>
              <span class="water-card-value" id="water-value">0/8 copos</span>
            </div>
            <div class="water-card-ml" id="water-ml-display">0 / 2000 ml</div>
          </div>
          <div class="water-progress">
            <div class="water-progress-bar" id="water-progress-bar"></div>
          </div>
          <div class="water-card-actions">
            <button class="water-btn water-btn-minus" id="btn-water-minus" aria-label="Remover 200ml">
              <i data-lucide="minus" style="width:16px;height:16px"></i>
            </button>
            <div class="water-glass-chips">
              <button class="water-chip" data-ml="200" aria-label="Adicionar 200ml">200ml</button>
              <button class="water-chip" data-ml="300" aria-label="Adicionar 300ml">300ml</button>
              <button class="water-chip" data-ml="400" aria-label="Adicionar 400ml">400ml</button>
              <button class="water-chip" data-ml="500" aria-label="Adicionar 500ml">500ml</button>
            </div>
          </div>
        </div>

        <div class="quick-add-meal" id="quick-add-meal">
          <i data-lucide="plus" style="width:18px;height:18px"></i> Adicionar alimento
        </div>

        <div class="section-separator">Hoje</div>
        <div class="meals-list" id="meals-list"></div>
      </main>

      <button class="fab" id="btn-add-meal" aria-label="Adicionar refeição">
        <i data-lucide="plus" style="width:24px;height:24px"></i>
      </button>

      <!-- Quick action menu (bottom sheet above FAB) -->
      <div class="quick-action-menu" id="quick-action-menu">
        <button type="button" class="quick-action-item" data-action="meal">
          <i data-lucide="utensils" style="width:18px;height:18px"></i>
          <span>Adicionar alimento</span>
        </button>
        <button type="button" class="quick-action-item" data-action="weight">
          <i data-lucide="weight" style="width:18px;height:18px"></i>
          <span>Registrar peso</span>
        </button>
        <button type="button" class="quick-action-item" data-action="water">
          <i data-lucide="droplet" style="width:18px;height:18px"></i>
          <span>Registrar água</span>
        </button>
      </div>

      <!-- Water quick-add modal -->
      <div class="water-modal-overlay" id="water-modal-overlay">
        <div class="water-modal" id="water-modal">
          <div class="water-modal-header">
            <span class="water-modal-title">Registrar água</span>
            <button class="water-modal-close" id="water-modal-close" aria-label="Fechar">
              <i data-lucide="x" style="width:16px;height:16px"></i>
            </button>
          </div>
          <div class="water-modal-inputs">
            <input type="number" id="water-modal-ml" min="10" max="2000" step="10" placeholder="Digite ml" inputmode="numeric" class="water-modal-field" />
          </div>
          <div class="water-modal-chips">
            <button class="water-modal-chip" data-ml="200">200ml</button>
            <button class="water-modal-chip" data-ml="300">300ml</button>
            <button class="water-modal-chip" data-ml="400">400ml</button>
            <button class="water-modal-chip" data-ml="500">500ml</button>
          </div>
          <button class="btn-primary water-modal-confirm" id="water-modal-confirm">Adicionar</button>
        </div>
      </div>

      <!-- Quick action overlay (click outside to close) -->
      <div class="quick-action-overlay" id="quick-action-overlay"></div>
    </section>

    <!-- ============ CAPTURE ============ -->


    <!-- ============ RESULTS ============ -->


    <!-- ============ HISTORY ============ -->


    <!-- ============ SETTINGS ============ -->


    <!-- ============ DIET PLAN ============ -->


    <!-- ============ CONFIRMATION OVERLAY ============ -->
    <div class="confirm-overlay" id="confirm-overlay" style="display:none">
      <div class="confirm-check">
        <svg viewBox="0 0 52 52" class="confirm-svg">
          <circle cx="26" cy="26" r="25" fill="none" class="confirm-circle"/>
          <path fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" class="confirm-checkmark"/>
        </svg>
        <p>Refeição salva!</p>
      </div>
    </div>

    <!-- ============ ONBOARDING ============ -->


    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <nav class="nav">
      <button class="nav-btn active" data-screen="dashboard">
        <i data-lucide="layout-dashboard"></i>
        <span>Início</span>
      </button>
      <button class="nav-btn" data-screen="history">
        <i data-lucide="calendar-days"></i>
        <span>Histórico</span>
      </button>
      <button class="nav-btn" data-screen="diet">
        <i data-lucide="clipboard-list"></i>
        <span>Meu Plano</span>
      </button>
      <button class="nav-btn" data-screen="settings">
        <i data-lucide="settings"></i>
        <span>Config.</span>
      </button>
    </nav>
  </div>
   <script type="module" src="js/app.js"></script>
</body>
</html>
