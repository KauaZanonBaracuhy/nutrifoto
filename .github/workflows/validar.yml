name: Validar NutriFoto
on:
  push:
  pull_request:
jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run test:seguranca
      - run: pnpm test
      # A experiência atual usa ativação; suites antigas de login/Stripe continuam disponíveis manualmente.
      - run: pnpm run test:licencas:interface
      - run: pnpm run test:pwa
      - run: pnpm run build:cloudflare
      - run: pnpm run test:cloudflare
      - run: pnpm run test:fonte-limpa
      - run: docker pull postgres:15-alpine
      - run: pnpm run test:postgres
        env:
          NUTRIFOTO_TESTAR_POSTGRES: 'true'
      - run: pnpm run test:licencas:postgres
      - run: pnpm run test:carga:comercial
      - run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-nutrifoto
          path: evidencias/
